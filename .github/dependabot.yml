version: 2
updates:
  # Keep the Jellyfin SDK and other NuGet packages current.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      jellyfin:
        patterns:
          - "Jellyfin.*"
      analyzers:
        patterns:
          - "*Analyzer*"
          - "StyleCop.*"
    # SkiaSharp's runtime is supplied by the Jellyfin host, so the
    # plugin's reference must EXACTLY match Jellyfin's pinned version
    # per ABI (see comment in Jellyfin.Plugin.Harmonie.csproj). We
    # never want Dependabot to bump these — bumps cause the plugin
    # DLL to fail to load with status NotSupported on hosts that ship
    # an older SkiaSharp. When Jellyfin itself bumps, we bump
    # manually in the same PR that updates the Jellyfin.Controller
    # version. SkiaSharp.HarfBuzz and the NativeAssets.* siblings are
    # included so the family stays in lockstep.
    ignore:
      - dependency-name: "SkiaSharp"
      - dependency-name: "SkiaSharp.*"
      # Jellyfin and Microsoft.Data.Sqlite are pinned to the FLOOR of each
      # supported server line (see Directory.Build.props): compiling
      # against a later patch produces a plugin DLL that fails to load on
      # earlier servers of the same line. Bumps happen manually when a new
      # server line is added.
      - dependency-name: "Jellyfin.*"
      - dependency-name: "Microsoft.Data.Sqlite"
      # SQLitePCLRaw is pinned only to lift a vulnerable transitive
      # (GHSA-2m69-gcr7-jv3q) and must stay on the 2.1.x line every
      # Jellyfin host ships at runtime. Patch bumps within the line are
      # fine; cross-major bumps diverge tests from the host for no gain.
      - dependency-name: "SQLitePCLRaw.*"
        update-types: ["version-update:semver-major"]

  # Keep workflow Action versions current (e.g. actions/checkout@v4 → v5).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
